<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ascend prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070B09;--card:#0F1612;--ink:#E8F5EC;--mut:#8FA79A;--pri:#22C55E;--ok:#4ADE80;--warn:#F5B301;--bad:#FF5C73;--line:#1D2B23;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(900px 420px at 50% -120px,#0F3D22 0%,transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;height:100%;max-width:480px;padding:16px 16px 110px;overflow-y:auto}
#stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#phone{position:relative;width:100%;height:100%}
#screen{position:relative;width:100%;height:100%;overflow:hidden;transform:translateZ(0);background:var(--bg)}
#island,#sb,#hi{display:none}
@media(min-width:520px) and (min-height:640px){
#stage{padding:20px 0;overflow:hidden}
#phone{width:464px;height:980px;flex:none;transform-origin:center center;border:12px solid #17191A;border-radius:74px;box-shadow:0 0 0 2px #4A4F4C,0 0 0 4px #0A0C0B,0 0 90px rgba(34,197,94,.22),0 40px 90px rgba(0,0,0,.6);overflow:hidden}
#screen{border-radius:62px}
#app{max-width:none;padding-top:66px}
#island{display:block;position:absolute;top:10px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:20px;background:#000;z-index:30}
#sb{display:flex;justify-content:space-between;align-items:center;position:absolute;top:0;left:0;right:0;height:59px;padding:14px 38px 0 44px;font-size:15px;z-index:25;pointer-events:none;background:linear-gradient(var(--bg),transparent)}
#hi{display:block;position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:rgba(255,255,255,.75);z-index:30}
#tb{padding-bottom:18px!important}
#fab{bottom:96px!important}
}
h1{font-size:28px;margin:8px 0;letter-spacing:-.5px}h2{font-size:18px;margin:0 0 8px}p{margin:6px 0;line-height:1.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px rgba(0,0,0,.45)}
.mut{color:var(--mut);font-size:14px}.big{font-size:40px;font-weight:800;letter-spacing:-1px;color:#4ADE80}
button{font:inherit;min-height:48px;border-radius:14px;border:0;padding:0 18px;font-weight:600;cursor:pointer}
.b1{background:var(--pri);color:#04130A;box-shadow:0 0 18px rgba(34,197,94,.35)}.b2{background:transparent;border:1.5px solid var(--pri);color:var(--pri)}
.row{display:flex;gap:10px}.row>*{flex:1}
input{font:inherit;width:100%;min-height:48px;border-radius:14px;border:1.5px solid var(--line);padding:0 14px;background:var(--card);color:var(--ink)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#16A34A,#4ADE80);transition:width .6s}
.pill{display:inline-block;padding:4px 12px;border-radius:20px;background:var(--pri);color:#04130A;font-size:13px;font-weight:700}
.ban{background:linear-gradient(120deg,#14532D,#052E16);border:1px solid #166534;color:#BBF7D0;border-radius:16px;padding:12px 14px;font-weight:600;min-height:48px}
#fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:30px;background:var(--pri);color:#04130A;font-size:22px;box-shadow:0 0 22px rgba(34,197,94,.55);padding:0;z-index:5}
#fab.pulse{animation:p 2s infinite}@keyframes p{50%{transform:scale(1.08)}}
@media(prefers-reduced-motion:reduce){#fab.pulse{animation:none}.bar i{transition:none}}
#sheet{position:fixed;inset:0;background:rgba(10,10,40,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
#sheet>div{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px;max-height:85%;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
button:focus-visible,input:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.good{color:var(--ok)}.badc{color:var(--bad)}
</style></head><body><div id="stage"><div id="phone"><div id="island"></div><div id="sb"><b>9:41</b><span>5G ▂▄▆ ▭</span></div><div id="screen"><div id="app"></div><button id="fab" aria-label="Interest you could avoid" style="display:none">₹✨</button><div id="sheet"></div></div><div id="hi"></div></div></div>
<script>
const USERS={
aarav:{n:'Aarav, 19',inf:6,avg:1800,min:200,bills:5,ratio:.9,note:'₹6,000 parent allowance + freelance'},
thin:{n:'Thin-file student',inf:5,avg:1200,min:200,bills:4,ratio:1.0,note:'Irregular small inflows'},
kabir:{n:'Kabir, 23',inf:6,avg:15000,min:8000,bills:6,ratio:.7,note:'Salaried ₹45,000',sal:1},
weak:{n:'Low-activity user',inf:3,avg:600,min:50,bills:2,ratio:1.1,note:'Gaps in income'}};
const INF={aarav:8000,thin:3000,kabir:45000,weak:2000,flag:9000};const REG=()=>{const u=USERS[S.u];return !!u&&u.sal==1&&!u.flag&&S.score>=70};const incLim=()=>Math.min(20000,Math.floor((INF[S.u]||0)*Math.pow(1.05,S.streak)*(S.streak>=4?.5:S.streak>=2?.35:.25)/500)*500);const LAD=[2000,4000,7500,10000,15000,20000],RATE={Rookie:.02,Veteran:.0175,Pro:.015},BAN=['🔥 Every on-time payment builds your streak. Veteran is calling!','⚡ One more on-time payment to level up. Your future self says thanks!','🏆 Rookies who pay on time reach Veteran fast. You can do it!'];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
let S;try{S=JSON.parse(localStorage.getItem('sw2')||'null')}catch(e){}
S=S||{step:'login',day:0,streak:0,reported:0,carried:0,fees:0,history:[],loan:null,restart:false,xp:0};
const save=()=>{try{localStorage.setItem('sw2',JSON.stringify(S))}catch(e){}};
function stats(u){const f=[['Income regularity',30*u.inf/6],['Balance stability',25*(clamp(u.avg/2000)*.6+clamp(u.min/500)*.4)],['Bill habits',25*u.bills/6],['Spend vs income',20*clamp((1.1-u.ratio)/.4)]];return{f,t:f.reduce((a,x)=>a+x[1],0)}}
const base=()=>REG()?incLim():(S.score>=70?2000:1000);
const isBlk=()=>!!(S.blocked||(S.blockUntil&&S.day<S.blockUntil));const blkN=()=>60+30*((S.defs||1)-1);const blockMsg=()=>'A loan was still unpaid 60 days after it was taken, so borrowing is blocked for '+blkN()+' days'+(S.blockUntil?' (until day '+S.blockUntil+')':'')+' and until the loan is paid in full. Repeat defaults make the block longer: 60 days, then 90, then 120, and so on. After the block, your limit restarts at ₹1,000.';const limit=()=>isBlk()?0:S.loan&&S.loan.status!='closed'&&S.loan.late?0:(S.restart?1000:(REG()?incLim():S.streak==0?base():Math.min(((s)=>s>=8?20000:s>=6?15000:s>=4?10000:s>=3?7500:s>=2?4000:2000)(S.streak),(S.dev&&S.dev.partner)||S.reported>=6?20000:10000)));
const league=l=>l<=2000?'Rookie':l<=10000?'Veteran':'Pro';
const bureau=()=>S.reported>=6?Math.round(clamp(650+S.streak*15-S.carried*5,300,900)):null;
function render(){const a=document.getElementById('app'),fab=document.getElementById('fab');fab.style.display=S.step=='home'?'block':'none';
if(S.step=='login'){a.innerHTML=`<h1>Ascend</h1><p class="mut">Build your credit history with small loans you can actually repay. 18+ only.</p><div class="card"><h2>Log in or sign up</h2><input id="dob" type="date" aria-label="Date of birth"><p></p><input id="ph" inputmode="numeric" placeholder="Phone number"><p></p><input id="otp" inputmode="numeric" placeholder="OTP (demo: 123456)"><p id="err" class="badc"></p><button class="b1" style="width:100%" onclick="login()">Continue</button><p></p><button class="b2" style="width:100%" onclick="demoFill()">Fill demo details</button></div><p class="mut">Prototype. Loans come from a partner lender. All data is simulated.</p>`}
else if(S.step=='pick'){a.innerHTML=`<h1>Choose a demo bank profile</h1><p class="mut">Stands in for Account Aggregator data (6 months of statements).</p>`+Object.entries(USERS).map(([k,u])=>`<div class="card"><h2>${u.n}</h2><p class="mut">${u.note}</p><button class="b1" onclick="pick('${k}')">Connect this account</button></div>`).join('')+`<p class="mut">We never look at your contacts, photos, messages or location.</p>`}
else if(S.step=='stats'){const r=stats(USERS[S.u]);S.score=Math.round(r.t);const ok=S.score>=55;a.innerHTML=`<h1>Your stats</h1><div class="card"><div class="big">${S.score}<span class="mut" style="font-size:18px"> / 100</span></div>${r.f.map(x=>`<p><b>${x[0]}</b> <span class="mut">${x[1].toFixed(0)} pts</span></p><div class="bar"><i style="width:${x[1]/ (x[0]=='Spend vs income'?20:x[0]=='Income regularity'?30:25)*100}%"></i></div>`).join('')}</div>`+(ok?`<div class="card"><p class="mut">Your starting limit</p><div class="big">${inr(base())}</div><p class="mut">Held by: starting score. It grows with every on-time full payment.</p><p class="mut">On-time payments build your credit score. Missed payments can hurt it. Your lender reports to credit bureaus.</p></div><button class="b1" style="width:100%" onclick="S.step='home';save();render()">Agree and continue</button>`:`<div class="card"><h2>Not eligible yet</h2><p>Your score is below 55. Try again in 60 days. Tip: keep a steady monthly inflow and pay bills on time.</p></div><button class="b2" style="width:100%" onclick="reset()">Try another profile</button>`)}
else home(a);
fab.className=(avoid()>0?'pulse':'');}
function avoid(){return S.fees}
function home(a){const L=limit(),lg=league(L||base()),ln=S.loan&&S.loan.status!='closed'?S.loan:null,bs=bureau(),ps=Math.round(clamp(300+S.streak*60+(S.score||0)*3-S.carried*10,300,900));
let h=`<div class="ban" id="ban">${BAN[S.day%3]}</div><div class="card"><p class="mut">Available limit · <span class="pill">${lg}</span></p><div class="big">${ln?inr(0):inr(L)}</div><p class="mut">Held by: ${S.restart?'restart after a missed payment':REG()?'income cap (25% of monthly inflow, rising to 50%)':S.streak==0?'starting score':'on-time streak'} · Streak: ${S.streak} on-time</p><div class="bar"><i style="width:${Math.min(100,S.streak/3*100)}%"></i></div><p class="mut">${REG()?'Your limit follows your income: 25% of monthly inflow now, 35% after 2 clean payments, 50% after 4 (max ₹20,000). Inflow is assumed to grow 5% after each clean payment.':S.streak<3?(3-S.streak)+' on-time full payments to ₹10,000':(L>=10000&&!((S.dev&&S.dev.partner)||S.reported>=6)?'Above ₹10,000 needs partner review. It opens after 6 reported months.':S.streak<8?'Keep paying on time for the next step.':'You are at the top of this pilot.')}</p></div>`;
if(ln){const late=S.day>ln.due,over=!!ln.late,rt=RATE[league(base())=='Rookie'&&S.streak==0?'Rookie':lg];ln.over=over;
h+=`<div class="card"><h2>Active loan</h2><div class="big">${inr(ln.out)}</div><p class="mut">${over?(ln.ref?'This loan is now with our partner lender for recovery. They may send reminders and call you, only as RBI rules allow: between 8am and 7pm, never contacting your family or friends, and no public shaming. Pay in full to clear it.':ln.def||ln.late>=3?'This loan is reported as defaulted (unpaid 60 days after borrowing). Pay in full to clear it. Borrowing reopens at ₹1,000 after that.':'Deadline passed. Simple interest was added on the amount borrowed and repeats every 40 days. Next interest on day '+ln.due+'. New loans are paused until this is cleared.'):late?'Grace period. No fee, but pay soon.':'Due in '+(ln.due-S.day)+' days (day '+ln.due+')'}</p>${ln.partials?`<p><b>Next payment:</b> ${inr(ln.out)} by day ${ln.due}. Pay it all and there is no further fee.</p>`:''}<div class="row"><button class="b1" onclick="payFull()">Pay in full</button><button class="b2" onclick="payPart()" ${ln.partials>=3||over?'disabled style="opacity:.4"':''}>Pay part</button></div>${ln.partials>=3?'<p class="mut">Part payments used up for this loan. Please pay in full.</p>':''}</div>`}
else{h+=`<button class="b1" style="width:100%" onclick="borrow()" ${L<=0?'disabled':''}>Borrow</button>`}
h+=`<div class="row"><div class="card"><p class="mut">Payment Score</p><div class="big" style="font-size:30px">${ps}</div><p class="mut">Ours, not a bureau score</p></div><div class="card"><p class="mut">Bureau score (simulated demo)</p>${bs?`<div class="big" style="font-size:30px">${bs}</div>`:`<div class="big" style="font-size:30px">🔒</div><p class="mut">Reported ${S.reported} of 6 months</p>`}</div></div>
<div class="card"><h2>Bureau-ready</h2><div class="bar"><i style="width:${S.reported/12*100}%"></i></div><p class="mut">${S.reported} of 12 on-time months. Banks look for about 12 clean months.</p></div>
<div class="card"><h2>Weekly quest</h2><p class="mut">Check your stats and read a tip. Earn XP (cosmetic only, never changes your limit).</p><button class="b2" onclick="S.xp+=10;save();toast('+10 XP')">Mark tip as read</button> <span class="mut">XP: ${S.xp}</span></div>
<div class="card"><p class="mut">Demo tools · Day ${S.day}</p><div class="row"><button class="b2" onclick="S.day+=5;save();render()">+5 days</button><button class="b2" onclick="S.day+=10;save();render()">+10 days</button><button class="b2" onclick="reset()">Reset</button></div></div>`;a.innerHTML=h}
function demoFill(){document.getElementById('dob').value='2005-06-15';document.getElementById('ph').value='9876543210';document.getElementById('otp').value='123456'}
function login(){const d=document.getElementById('dob').value,o=document.getElementById('otp').value.replace(/\D/g,''),p=document.getElementById('ph').value.replace(/\D/g,'');const e=[];
if(!d)e.push('Enter your date of birth.');else if((Date.now()-new Date(d))/31557600000<18)e.push('Come back at 18. Credit products are for adults only.');
if(p.length<10)e.push('Enter a 10-digit phone number.');
if(o!=='123456')e.push('OTP: type 123456 in this demo.');
if(e.length){document.getElementById('err').innerHTML=e.join('<br>');return}S.step='pick';save();render()}
function pick(k){S.u=k;S.step='stats';save();render()}
function reset(){localStorage.removeItem('sw2');S={step:'login',day:0,streak:0,reported:0,carried:0,fees:0,history:[],loan:null,restart:false,xp:0};render()}
function sheet(h){const s=document.getElementById('sheet');s.innerHTML='<div>'+h+'<p></p><button class="b2" style="width:100%" onclick="closeS()">Close</button></div>';s.style.display='flex'}
function closeS(){document.getElementById('sheet').style.display='none'}
function toast(m){sheet('<h2>'+m+'</h2>')}
function rt(){return RATE[league(limit()||base())]}
function borrow(){S.amt=limit();const L=S.amt,r=rt(),M=limit();sheet(`<h2>Key facts before you borrow</h2><p>You receive your full limit: <b>${inr(L)}</b>, sent straight to your bank account.</p><p>For 40 days</p><p class="good"><b>Pay it all by day 40, in parts or in one go: ₹0 extra.</b></p><p>If anything is still unpaid at the end of day 40, interest of ${(r*100).toFixed(2)}% of what is left is added to your next payment. Example: pay ${inr(L*.25)} by day 40, ${inr(L*.75)} left, interest ${inr(L*.75*r)}, next payment ${inr(L*.75*(1+r))}.</p><p class="mut">No other penalty fees. Money goes straight to your own bank account from our partner lender. Reported to credit bureaus. We never contact your friends or family.</p><button class="b1" style="width:100%" onclick="doBorrow()">Agree and get ${inr(L)}</button>`)}
function doBorrow(){const L=limit();S.loan={amt:L,out:L,due:S.day+40,partials:0,status:'active',rate:rt()};save();closeS();render()}
function payFull(){const l=S.loan,onTime=S.day<=l.due&&!l.late,first=S.day<=l.due&&!l.late&&!l.rnd;S.history.push({amt:l.amt,parts:l.partials,fees:l.fees||0});
if(!onTime){S.streak=0;S.restart=true;sheet('<h2>Cleared. Late interest was added.</h2><p>Your limit restarts at ₹1,000. Pay on time to climb back.</p>')}
else{S.reported++;if(first){S.streak++;sheet(`<h2>🎉 Paid in full, ₹0 extra!</h2><p>Reported to the credit bureau ✓</p><p>Streak: ${S.streak}. New limit: ${inr(limit())} (${league(limit())}).</p>`)}else sheet('<h2>Loan cleared 🎉</h2><p>Reported to the credit bureau ✓. Pay in full on the first due date to grow your streak.</p>')}
S.loan=null;save();render()}
function payPart(){const l=S.loan,min=Math.min(Math.ceil((l.lim||l.amt)/6),l.out-1);sheet(`<h2>Pay part</h2><p class="mut">Minimum ${inr(min)} (one sixth of your limit). Outstanding ${inr(l.out)}.</p><input id="pa" type="range" min="${min}" max="${Math.floor(l.out-1)}" value="${min}" oninput="pv(this.value)"><div id="pv"></div><button class="b1" style="width:100%" onclick="doPart()">Confirm part payment</button>`);pv(min)}
function pv(v){v=+v;const l=S.loan,left=l.out-v,ok=S.day<=l.due&&!l.late,fee=left*l.rate;document.getElementById('pv').innerHTML=ok?`<p>Pay now: <b>${inr(v)}</b></p><p>Left: <b>${inr(left)}</b></p><p>Pay the rest by day ${l.due}: <b>no interest</b>.</p><p class="mut">If anything is still unpaid then, interest of about ${inr(fee)} is added to your next payment.</p>`:`<p>Pay now: <b>${inr(v)}</b></p><p>Left: <b>${inr(left)}</b></p><p class="mut">The deadline has passed. Your next payment (including interest) is due by day ${l.due}.</p>`}
function doPart(){const v=+document.getElementById('pa').value,l=S.loan,left=l.out-v,fee=left*l.rate;l.out=Math.round(left+fee);l.due+=30;l.partials++;l.fees=(l.fees||0)+fee;S.fees=Math.round(S.fees+fee);S.carried++;save();closeS();render()}
document.getElementById('fab').onclick=()=>{const l=S.loan&&S.loan.status!='closed'?S.loan:null;const rows=S.history.filter(x=>x.fees>0).map(x=>`<p>${inr(x.amt)} loan · ${x.parts} part payment(s) · fee ${inr(x.fees)}</p>`).join('');
sheet(`<h2>Interest you could avoid</h2><div class="big">${inr(S.fees)}</div><p class="mut">Total fees paid so far that paying in full would have avoided.</p>${S.fees==0?'<p class="good">₹0 extra paid 🎉 Paying in full keeps it that way.</p>':''}${rows}${l?`<p><b>Pay in full today and you avoid ${inr(l.out*l.rate)} of future fees.</b></p>`:''}<p class="mut">Part-paying is okay when you need breathing room. This just shows what paying in full would save you.</p>`)};
render();
</script><script>
USERS.flag={n:'Flagged profile',inf:6,avg:3000,min:2500,bills:5,ratio:.8,note:'Money goes out and comes back; balance padded',flag:1};

function init(){S.consent=S.consent||{u:1,i:1,o:0,b:0};if(S.onb==null)S.onb=0;S.tab=S.tab||'home';S.dev=S.dev||{pay:'Success',name:0,joint:0,bank:0,mand:0};S.got=S.got||{};S.vouch=S.vouch||[];S.q=S.q||{};S.admin=S.admin||0}
init();
const flags=()=>{const u=USERS[S.u]||{},f=[];if(u.flag)f.push(['High','Circular inflows and a padded balance']);if(S.dev.bank)f.push(['Medium','Bank account changed. New loans paused 7 days']);return f};
const tb=document.createElement('nav');tb.id='tb';tb.style.cssText='position:fixed;bottom:0;left:0;right:0;display:none;justify-content:center;background:#050806;border-top:1px solid #14532D;padding-bottom:env(safe-area-inset-bottom,0px);z-index:4';document.getElementById('screen').appendChild(tb);
const TABS=[['home','🏠','Home'],['score','📈','Score'],['league','🏆','Leagues'],['rew','🎁','Rewards'],['learn','💡','Learn'],['admin','⚙️','Admin']];
const _r=render,_rs=reset;
reset=function(){_rs();init()};
render=function(){settle();const a=document.getElementById('app'),fab=document.getElementById('fab');fab.style.bottom='calc(76px + env(safe-area-inset-bottom,0px))';
if(S.step!=='home'){tb.style.display='none';return _r()}
if(S.onb<4){tb.style.display='none';fab.style.display='none';return onb(a)}
tb.style.display='flex';tb.innerHTML='<div style="display:flex;width:100%;max-width:480px">'+TABS.map(t=>`<button onclick="S.tab='${t[0]}';save();render()" style="flex:1;background:none;color:${S.tab==t[0]?'var(--pri)':'var(--mut)'};font-size:11px;padding:4px 0">${t[1]}<br>${t[2]}</button>`).join('')+'</div>';
({home:()=>{_r();if(isBlk())a.insertAdjacentHTML('afterbegin','<div class="card"><h2>Borrowing is blocked</h2><p class="mut">'+blockMsg()+'</p></div>');if(S.cool&&S.day<S.cool&&!S.loan)a.insertAdjacentHTML('afterbegin','<div class="card"><h2>Next loan opens on day '+S.cool+'</h2><p class="mut">Your limit upgrade unlocks then too.</p></div>');const f=flags();if(f.length)a.insertAdjacentHTML('afterbegin','<div class="card"><h2>We are double-checking a few details</h2><p class="mut">Usually 1-2 days. New loans are paused meanwhile.</p>'+f.map(x=>'<p class="mut">'+x[1]+'</p>').join('')+'</div>')},score:()=>tScore(a),league:()=>tLeague(a),rew:()=>tRew(a),learn:()=>tLearn(a),admin:()=>tAdmin(a)})[S.tab]();fab.style.display='block'};
function onb(a){const c=S.consent,st=n=>`<p class="mut">Step ${n+1} of 4</p><div class="bar"><i style="width:${(n+1)*25}%"></i></div>`,t=(k,l,d)=>`<label class="card" style="display:flex;gap:12px;align-items:flex-start"><input type="checkbox" style="width:24px;min-height:24px" ${c[k]?'checked':''} onchange="S.consent['${k}']=this.checked?1:0;save()"><span><b>${l}</b><br><span class="mut">${d}</span></span></label>`;
